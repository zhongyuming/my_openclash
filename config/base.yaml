# subconverter 生成 Clash/Mihomo 配置时使用的基础文件。
# 节点、策略组和规则由 config/subconverter.ini 在转换时写入。

mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 个人规则由 Mihomo 直接从本仓库下载，避免受 subconverter 远程缓存影响。
rule-providers:
  MyProxy:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-proxy.list"
    proxy: 主代理
    path: ./rule_provider/MyProxy.list
    interval: 86400

  MyDirect:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-direct.list"
    proxy: 主代理
    path: ./rule_provider/MyDirect.list
    interval: 86400

  MyAI:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-ai.list"
    proxy: 主代理
    path: ./rule_provider/MyAI.list
    interval: 86400

  MyReject:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-reject.list"
    proxy: 主代理
    path: ./rule_provider/MyReject.list
    interval: 86400

  # Telegram 直连 IP 规则；单独使用 MetaCubeX 的 IP CIDR MRS 数据。
  TelegramIP:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"
    proxy: 主代理
    path: ./rule_provider/TelegramIP.mrs
    interval: 86400

proxies: []
proxy-groups: []
rules: []
