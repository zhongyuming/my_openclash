[custom]
; OpenClash 配置订阅使用的 subconverter 外部模板。
; 机场订阅地址由 OpenClash 传给转换服务，不要写进本文件。

enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/zhongyuming/my_openclash/main/config/base.yaml

; 清理机场的流量、到期、公告等非代理节点。
exclude_remarks=(?i)(流量|套餐|到期|剩余|重置|官网|网站|防失联|失联|公告|通知|客服|工单|订阅|expire|traffic|reset|remaining|official|website)

; -----------------------------------------------------------------------------
; 规则顺序：个人拒绝 > 个人直连 > 个人 AI > 个人代理 > 服务规则 > 大范围规则。
; 四份个人规则在每次配置订阅更新时从本仓库读取。
; -----------------------------------------------------------------------------
ruleset=我的拒绝网站,clash-classic:https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-reject.list,86400
ruleset=我的直连网站,clash-classic:https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-direct.list,86400
ruleset=AI,clash-classic:https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-ai.list,86400
ruleset=我的代理网站,clash-classic:https://raw.githubusercontent.com/zhongyuming/my_openclash/main/rules/my-proxy.list,86400

; 服务类规则使用 GEOSITE，不使用 GEOIP,Netflix/GitHub 等服务名称。
ruleset=DIRECT,[]GEOSITE,private
ruleset=AI,[]GEOSITE,category-ai-!cn
ruleset=微软,[]GEOSITE,microsoft
ruleset=Netflix,[]GEOSITE,netflix
ruleset=Telegram,[]GEOSITE,telegram
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=游戏,[]GEOSITE,category-games

; 公共境外数据库的精确分类，位于中国域名和全局兜底之前。
ruleset=主代理,[]GEOSITE,gfw
ruleset=主代理,[]GEOSITE,category-scholar-!cn
ruleset=主代理,[]GEOSITE,category-social-media-!cn
ruleset=主代理,[]GEOSITE,category-browser-!cn
ruleset=主代理,[]GEOSITE,category-anticensorship
ruleset=主代理,[]GEOSITE,category-vpnservices

; 大范围规则必须位于个人规则之后。
ruleset=DIRECT,[]GEOSITE,cn
ruleset=主代理,[]GEOSITE,geolocation-!cn
ruleset=DIRECT,[]GEOIP,private,no-resolve
ruleset=DIRECT,[]GEOIP,CN,no-resolve
ruleset=主代理,[]FINAL

; -----------------------------------------------------------------------------
; 应用与自定义策略组。
; -----------------------------------------------------------------------------
custom_proxy_group=主代理`select`[]香港自动`[]台湾自动`[]日本自动`[]韩国自动`[]新加坡自动`[]美国自动`[]香港手动`[]台湾手动`[]日本手动`[]韩国手动`[]新加坡手动`[]美国手动`[]DIRECT
custom_proxy_group=AI`select`[]美国自动`[]新加坡自动`[]日本自动`[]美国手动`[]新加坡手动`[]日本手动`[]主代理
custom_proxy_group=微软`select`[]DIRECT`[]主代理`[]香港自动`[]日本自动`[]美国自动
custom_proxy_group=Netflix`select`[]主代理`[]香港自动`[]台湾自动`[]日本自动`[]韩国自动`[]新加坡自动`[]美国自动
custom_proxy_group=Telegram`select`[]主代理`[]新加坡自动`[]香港自动`[]日本自动`[]美国自动
custom_proxy_group=游戏`select`[]DIRECT`[]主代理`[]香港自动`[]台湾自动`[]日本自动`[]韩国自动`[]新加坡自动`[]美国自动
custom_proxy_group=我的代理网站`select`[]主代理`[]香港自动`[]台湾自动`[]日本自动`[]韩国自动`[]新加坡自动`[]美国自动`[]DIRECT
custom_proxy_group=我的直连网站`select`[]DIRECT`[]主代理
custom_proxy_group=我的拒绝网站`select`[]REJECT`[]DIRECT

; -----------------------------------------------------------------------------
; 地区自动测速组。INI 正则中的单词边界写成 \b，不要写成 \\b。
; -----------------------------------------------------------------------------
custom_proxy_group=香港自动`url-test`(?i)(香港|港|\bHK\b|Hong\s*Kong)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=台湾自动`url-test`(?i)(台湾|台灣|台北|\bTW\b|Taiwan|Taipei)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本自动`url-test`(?i)(日本|东京|東京|大阪|\bJP\b|Japan|Tokyo|Osaka)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=韩国自动`url-test`(?i)(韩国|韓國|首尔|首爾|\bKR\b|Korea|Seoul)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡自动`url-test`(?i)(新加坡|狮城|獅城|\bSG\b|Singapore)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国自动`url-test`(?i)(美国|美國|洛杉矶|洛杉磯|硅谷|矽谷|西雅图|西雅圖|纽约|紐約|\bUS\b|United\s*States|Los\s*Angeles|San\s*Jose|Seattle|New\s*York)`https://www.gstatic.com/generate_204`300,,50

; -----------------------------------------------------------------------------
; 各地区手动节点组。
; -----------------------------------------------------------------------------
custom_proxy_group=香港手动`select`(?i)(香港|港|\bHK\b|Hong\s*Kong)
custom_proxy_group=台湾手动`select`(?i)(台湾|台灣|台北|\bTW\b|Taiwan|Taipei)
custom_proxy_group=日本手动`select`(?i)(日本|东京|東京|大阪|\bJP\b|Japan|Tokyo|Osaka)
custom_proxy_group=韩国手动`select`(?i)(韩国|韓國|首尔|首爾|\bKR\b|Korea|Seoul)
custom_proxy_group=新加坡手动`select`(?i)(新加坡|狮城|獅城|\bSG\b|Singapore)
custom_proxy_group=美国手动`select`(?i)(美国|美國|洛杉矶|洛杉磯|硅谷|矽谷|西雅图|西雅圖|纽约|紐約|\bUS\b|United\s*States|Los\s*Angeles|San\s*Jose|Seattle|New\s*York)
