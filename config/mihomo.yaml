# OpenClash + Mihomo 可维护配置模板
#
# 公开仓库中请始终保留占位符。实际使用时，只在路由器上的本地副本中
# 将 YOUR_SUBSCRIPTION_URL 替换为机场提供的 Clash/Mihomo 订阅地址。

mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
# 仅监听路由器本机，避免无密码控制接口暴露给整个 LAN。
# OpenClash 如需其他监听地址，会在运行时接管此项。
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  机场订阅:
    type: http
    url: "YOUR_SUBSCRIPTION_URL"
    path: ./proxy_provider/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true

proxy-groups:
  - name: 主代理
    type: select
    proxies:
      - 香港自动
      - 台湾自动
      - 日本自动
      - 韩国自动
      - 新加坡自动
      - 美国自动
      - 香港手动
      - 台湾手动
      - 日本手动
      - 韩国手动
      - 新加坡手动
      - 美国手动
      - DIRECT

  - name: AI
    type: select
    proxies:
      - 美国自动
      - 新加坡自动
      - 日本自动
      - 美国手动
      - 新加坡手动
      - 日本手动
      - 主代理

  - name: 微软
    type: select
    proxies:
      - DIRECT
      - 主代理
      - 香港自动
      - 日本自动
      - 美国自动

  - name: Netflix
    type: select
    proxies:
      - 主代理
      - 香港自动
      - 台湾自动
      - 日本自动
      - 韩国自动
      - 新加坡自动
      - 美国自动

  - name: Telegram
    type: select
    proxies:
      - 主代理
      - 新加坡自动
      - 香港自动
      - 日本自动
      - 美国自动

  - name: 游戏
    type: select
    proxies:
      - DIRECT
      - 主代理
      - 香港自动
      - 台湾自动
      - 日本自动
      - 韩国自动
      - 新加坡自动
      - 美国自动

  - name: 我的代理网站
    type: select
    proxies:
      - 主代理
      - 香港自动
      - 台湾自动
      - 日本自动
      - 韩国自动
      - 新加坡自动
      - 美国自动
      - DIRECT

  - name: 我的直连网站
    type: select
    proxies:
      - DIRECT
      - 主代理

  - name: 我的拒绝网站
    type: select
    proxies:
      - REJECT
      - DIRECT

  # 地区自动测速组。单引号中的反斜杠不会被 YAML 二次转义，
  # 所以正则单词边界必须写成 \b，而不是 \\b。
  - name: 香港自动
    type: url-test
    use:
      - 机场订阅
    filter: '(?i)(香港|港|\bHK\b|Hong\s*Kong)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 台湾自动
    type: url-test
    use:
      - 机场订阅
    filter: '(?i)(台湾|台灣|台北|\bTW\b|Taiwan|Taipei)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 日本自动
    type: url-test
    use:
      - 机场订阅
    filter: '(?i)(日本|东京|東京|大阪|\bJP\b|Japan|Tokyo|Osaka)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 韩国自动
    type: url-test
    use:
      - 机场订阅
    filter: '(?i)(韩国|韓國|首尔|首爾|\bKR\b|Korea|Seoul)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 新加坡自动
    type: url-test
    use:
      - 机场订阅
    filter: '(?i)(新加坡|狮城|獅城|\bSG\b|Singapore)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  - name: 美国自动
    type: url-test
    use:
      - 机场订阅
    filter: '(?i)(美国|美國|洛杉矶|洛杉磯|硅谷|矽谷|西雅图|西雅圖|纽约|紐約|\bUS\b|United\s*States|Los\s*Angeles|San\s*Jose|Seattle|New\s*York)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true

  # 各地区手动节点组。
  - name: 香港手动
    type: select
    use:
      - 机场订阅
    filter: '(?i)(香港|港|\bHK\b|Hong\s*Kong)'

  - name: 台湾手动
    type: select
    use:
      - 机场订阅
    filter: '(?i)(台湾|台灣|台北|\bTW\b|Taiwan|Taipei)'

  - name: 日本手动
    type: select
    use:
      - 机场订阅
    filter: '(?i)(日本|东京|東京|大阪|\bJP\b|Japan|Tokyo|Osaka)'

  - name: 韩国手动
    type: select
    use:
      - 机场订阅
    filter: '(?i)(韩国|韓國|首尔|首爾|\bKR\b|Korea|Seoul)'

  - name: 新加坡手动
    type: select
    use:
      - 机场订阅
    filter: '(?i)(新加坡|狮城|獅城|\bSG\b|Singapore)'

  - name: 美国手动
    type: select
    use:
      - 机场订阅
    filter: '(?i)(美国|美國|洛杉矶|洛杉磯|硅谷|矽谷|西雅图|西雅圖|纽约|紐約|\bUS\b|United\s*States|Los\s*Angeles|San\s*Jose|Seattle|New\s*York)'

rule-providers:
  MyProxy:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_GITHUB_REPOSITORY/main/rules/my-proxy.list"
    path: ./rule_provider/MyProxy.list
    interval: 86400

  MyDirect:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_GITHUB_REPOSITORY/main/rules/my-direct.list"
    path: ./rule_provider/MyDirect.list
    interval: 86400

  MyAI:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_GITHUB_REPOSITORY/main/rules/my-ai.list"
    path: ./rule_provider/MyAI.list
    interval: 86400

  MyReject:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/YOUR_GITHUB_USERNAME/YOUR_GITHUB_REPOSITORY/main/rules/my-reject.list"
    path: ./rule_provider/MyReject.list
    interval: 86400

  # 中国域名规则用于明确直连；未命中的流量最终也会直连。
  ChinaDomain:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./rule_provider/ChinaDomain.mrs
    interval: 86400

rules:
  # 私有规则优先：拒绝 > 直连 > AI > 代理。
  # 必须位于 ChinaDomain、GEOIP 和 MATCH 之前。
  - RULE-SET,MyReject,我的拒绝网站
  - RULE-SET,MyDirect,我的直连网站
  - RULE-SET,MyAI,AI
  - RULE-SET,MyProxy,我的代理网站

  # 内置 geosite 服务规则；不使用 GEOIP,Netflix/GitHub 等服务名。
  - GEOSITE,private,DIRECT
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,microsoft,微软
  - GEOSITE,netflix,Netflix
  - GEOSITE,telegram,Telegram
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,category-games,游戏

  # 公共境外数据库的精确分类；只有这些明确分类才走代理。
  - GEOSITE,gfw,主代理
  - GEOSITE,category-scholar-!cn,主代理
  - GEOSITE,category-social-media-!cn,主代理
  - GEOSITE,category-browser-!cn,主代理
  - GEOSITE,category-anticensorship,主代理
  - GEOSITE,category-vpnservices,主代理

  # 国内明确直连；其他未命中流量默认直连。
  - RULE-SET,ChinaDomain,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,DIRECT
